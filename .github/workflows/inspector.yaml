name: Python Inspector

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python version
        run: python --version

      - name: Check pip version
        run: pip --version

      - name: Find Python
        run: which python

      - name: Finish inspection
        run: echo "Inspection complete"